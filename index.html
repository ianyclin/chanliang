<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>展諒今日清單</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="今日清單">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff8ec">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --bg: #fff8ec;
    --card: #ffffff;
    --ink: #2b2a33;
    --muted: #7a7788;
    --line: #efe6d3;
    --accent: #e9731f;
    --accent-ink: #7a3a0c;
    --ok: #3cb371;
    --ok-bg: #e6f7ec;
    --warn: #e5484d;
    --warn-bg: #fdecec;
    --shadow: 0 4px 16px rgba(80, 60, 20, .08);
    --radius: 22px;
    --row-h: 72px;
    --s-國語: #e04b4b;
    --s-數學: #2a74d6;
    --s-社會: #c4820a;
    --s-自然: #1f9a63;
    --s-英文: #7352d6;
    --s-小提琴: #c04e98;
    --s-其他: #767585;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
    font-size: 20px;
    line-height: 1.4;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    -webkit-user-select: none; user-select: none;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px 16px 48px; }

  /* 頂部 */
  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .today { font-size: 30px; font-weight: 800; letter-spacing: .5px; }
  .today small { display: block; font-size: 16px; color: var(--muted); font-weight: 600; margin-top: 2px; }
  .refresh {
    border: 0; background: var(--card); color: var(--ink); box-shadow: var(--shadow);
    width: 56px; height: 56px; border-radius: 50%; font-size: 26px; cursor: pointer; flex: none;
    display: grid; place-items: center;
  }
  .refresh:active { transform: scale(.92); }
  .refresh.spin svg { animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .countdown {
    background: linear-gradient(135deg, #ffe0c2, #ffd1dc);
    border-radius: var(--radius); padding: 14px 18px; margin-bottom: 14px;
    display: flex; align-items: center; gap: 14px; box-shadow: var(--shadow);
  }
  .countdown .num { font-size: 44px; font-weight: 900; color: var(--accent-ink); line-height: 1; min-width: 60px; text-align: center; }
  .countdown .num small { font-size: 18px; font-weight: 700; margin-left: 2px; }
  .countdown .txt { font-size: 18px; font-weight: 700; color: #5a3a1a; }
  .countdown .txt span { display: block; font-size: 15px; color: #8a6a4a; font-weight: 600; }

  /* 區塊 */
  section { margin-bottom: 20px; }
  h2 {
    font-size: 18px; color: var(--muted); font-weight: 800; margin: 0 0 8px 6px; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
  }
  h2 .badge { background: var(--warn); color: #fff; border-radius: 999px; font-size: 14px; padding: 2px 10px; }
  h2 .badge.ok { background: var(--ok); }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }

  /* 項目列 */
  .item {
    display: flex; align-items: center; gap: 14px; min-height: var(--row-h); padding: 10px 16px;
    border-bottom: 1px solid var(--line); cursor: pointer; position: relative; transition: background .2s;
  }
  .item:last-child { border-bottom: 0; }
  .item:active { background: #fff5e6; }
  .item.done { background: var(--ok-bg); }
  .box {
    width: 44px; height: 44px; border-radius: 14px; border: 3px solid #cfc6b4; flex: none;
    display: grid; place-items: center; background: #fff; transition: all .2s;
  }
  .item.done .box { background: var(--ok); border-color: var(--ok); }
  .item.just .box { animation: pop .35s cubic-bezier(.2,1.6,.4,1); }
  .box svg { width: 28px; height: 28px; opacity: 0; transform: scale(.4); transition: all .2s; }
  .item.done .box svg { opacity: 1; transform: scale(1); }
  @keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .chip {
    flex: none; font-size: 15px; font-weight: 800; color: #fff; border-radius: 10px; padding: 4px 9px;
    background: var(--s-其他); min-width: 54px; text-align: center;
  }
  .label { flex: 1; font-size: 22px; font-weight: 700; word-break: break-word; }
  .label .sub { display: block; font-size: 15px; color: var(--muted); font-weight: 600; margin-top: 1px; }
  .item.done .label { color: #5f8f6f; text-decoration: line-through; text-decoration-thickness: 3px; text-decoration-color: rgba(60,179,113,.6); }
  .item .tag { flex: none; font-size: 13px; font-weight: 700; color: var(--warn); background: var(--warn-bg); border-radius: 8px; padding: 2px 8px; }

  .empty { padding: 28px 18px; text-align: center; color: var(--muted); font-weight: 700; }
  .alldone {
    padding: 28px 18px; text-align: center; background: linear-gradient(135deg, #e6f7ec, #fff6cc);
  }
  .alldone .big { font-size: 40px; font-weight: 900; color: #2e8b57; }
  .alldone p { margin: 6px 0 0; color: #557; font-weight: 700; }

  /* 進度條 */
  .prog { padding: 8px 16px; }
  .prow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .prow:last-child { border-bottom: 0; }
  .prow .chip { min-width: 60px; }
  .bar { flex: 1; height: 18px; background: #f0ebe0; border-radius: 999px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 999px; background: var(--s-其他); transition: width .6s ease; }
  .pct { font-size: 15px; font-weight: 800; color: var(--muted); min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }

  /* 近期大事 */
  .events { padding: 4px 16px; }
  .ev { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 18px; font-weight: 700; }
  .ev:last-child { border-bottom: 0; }
  .ev .d { color: var(--muted); font-size: 15px; min-width: 92px; font-variant-numeric: tabular-nums; }
  .ev .t { font-size: 13px; border-radius: 8px; padding: 2px 8px; background: #eee; color: #555; }
  .ev .t.exam { background: #ffe3e3; color: #b32; }
  .ev .t.off { background: #e6f7ec; color: #2e8b57; }

  /* 底部 */
  footer { margin-top: 24px; text-align: center; color: var(--muted); font-size: 13px; font-weight: 600; line-height: 1.8; }
  footer .ver { opacity: .7; }
  .status { display: inline-block; border-radius: 999px; padding: 1px 10px; background: #eee; }
  .status.warn { background: var(--warn-bg); color: var(--warn); }
  .status.ok { background: var(--ok-bg); color: #2e8b57; }

  .notice { background: #fff3cd; color: #6b4e00; border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; font-size: 16px; font-weight: 600; line-height: 1.5; }
  .notice code { background: rgba(0,0,0,.06); padding: 1px 6px; border-radius: 6px; font-size: 14px; }

  /* 慶祝畫面 */
  .party {
    position: fixed; inset: 0; background: rgba(255, 248, 236, .96); display: none;
    align-items: center; justify-content: center; flex-direction: column; text-align: center; z-index: 50; padding: 24px;
  }
  .party.show { display: flex; }
  .party .emoji { font-size: 110px; line-height: 1; animation: bounce 1s ease infinite alternate; }
  @keyframes bounce { to { transform: translateY(-18px) rotate(6deg); } }
  .party h1 { font-size: 52px; margin: 12px 0 4px; color: #2e8b57; font-weight: 900; }
  .party p { font-size: 22px; color: #557; font-weight: 700; margin: 0 0 28px; }
  .party button {
    border: 0; background: var(--accent); color: #fff; font-size: 24px; font-weight: 800; padding: 16px 40px; border-radius: 999px; box-shadow: var(--shadow); cursor: pointer;
  }
  .confetti { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: .8; } }

  /* 分頁切換 */
  .tabs { display: flex; gap: 10px; margin-bottom: 14px; }
  .tab {
    flex: 1; border: 0; background: var(--card); color: var(--muted); font-size: 20px; font-weight: 800;
    padding: 14px 0; border-radius: 16px; box-shadow: var(--shadow); cursor: pointer; font-family: inherit;
  }
  .tab.on { background: var(--accent); color: #fff; }
  .tab:active { transform: scale(.97); }
  .view { display: none; } .view.on { display: block; }

  /* 進度條展開細項 */
  .prow { cursor: pointer; }
  .prow .arrow { color: #c9c2b2; font-size: 18px; transition: transform .2s; }
  .prow.open .arrow { transform: rotate(90deg); }
  .pdetail { display: none; padding: 2px 0 10px 8px; }
  .prow.open + .pdetail { display: block; }
  .pd { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 17px; font-weight: 700; border-bottom: 1px dashed var(--line); }
  .pd:last-child { border-bottom: 0; }
  .pd .mk { width: 24px; height: 24px; border-radius: 8px; border: 2px solid #d8d0bd; flex: none; display: grid; place-items: center; font-size: 15px; color: #fff; }
  .pd.done .mk { background: var(--ok); border-color: var(--ok); }
  .pd.done .nm { color: #7d7d8c; text-decoration: line-through; }
  .pd .nm { flex: 1; }
  .pd .dt { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pd .dt.late { color: var(--warn); font-weight: 800; }
  .pd .dt.now { color: var(--accent-ink); font-weight: 800; }
  .addbtn { border: 0; background: #f3eee2; color: #6b6356; font-size: 15px; font-weight: 800; padding: 8px 14px; border-radius: 10px; margin-top: 8px; font-family: inherit; cursor: pointer; }
  .label .extra { display: inline-block; font-size: 13px; color: #1f6f8b; background: #e3f3f8; border-radius: 6px; padding: 1px 7px; margin-left: 6px; font-weight: 700; vertical-align: middle; }
  .sheet input { -webkit-user-select: text; user-select: text; width: 100%; font-size: 20px; padding: 12px 14px; border: 2px solid var(--line); border-radius: 14px; font-family: inherit; margin-bottom: 12px; box-sizing: border-box; }
  .sheet .go { width: 100%; border: 0; background: var(--accent); color: #fff; font-size: 18px; font-weight: 800; padding: 14px; border-radius: 14px; font-family: inherit; cursor: pointer; }

  /* 計畫：按日期 */
  .day { margin-bottom: 14px; }
  .dayh { display: flex; align-items: baseline; gap: 10px; margin: 0 0 6px 6px; flex-wrap: wrap; }
  .dayh .dn { font-size: 20px; font-weight: 900; }
  .dayh .dn.today { color: var(--accent-ink); }
  .dayh .dn.late { color: var(--warn); }
  .dayh .dw { font-size: 15px; color: var(--muted); font-weight: 700; }
  .dayh .cnt { font-size: 14px; color: var(--muted); font-weight: 700; margin-left: auto; margin-right: 6px; }
  .dayh .ev { padding: 0; border: 0; font-size: 14px; display: inline-flex; gap: 6px; }
  .dayh .ev .t { font-size: 12px; }
  .day .item { min-height: 60px; padding: 6px 14px; }
  .day .item.routine { pointer-events: none; }
  .day .item.routine .mv { display: none; }
  .day .item .box { width: 30px; height: 30px; border-radius: 9px; border-width: 2px; }
  .day .item .box svg { width: 20px; height: 20px; }
  .day .item .label { font-size: 18px; }
  .day .item.routine { opacity: .55; }
  .day .item.routine .label { font-size: 16px; }
  .day .empty { padding: 14px; font-size: 16px; }
  .legend { color: var(--muted); font-size: 14px; font-weight: 600; margin: 0 6px 10px; }
  .pastbtn { display: block; width: 100%; border: 0; background: transparent; color: var(--muted); font-size: 16px; font-weight: 800; padding: 10px; font-family: inherit; cursor: pointer; }
  #pastDays { display: none; } #pastDays.on { display: block; }
  #pastDays .day { opacity: .75; }
  .day.quiet { margin-bottom: 10px; }
  .day.quiet .dayh .dn { font-size: 17px; }
  .quietline { padding: 10px 16px; color: #b0a994; font-size: 15px; font-weight: 600; }

  /* 改期 */
  .mv { flex: none; border: 0; background: #f3eee2; color: #6b6356; font-size: 15px; font-weight: 800; min-height: 44px; min-width: 68px; padding: 0 14px; border-radius: 12px; cursor: pointer; font-family: inherit; }
  .mv:active { background: #e8e0cc; }
  .label .moved { display: inline-block; font-size: 13px; color: #a05a00; background: #fff1dc; border-radius: 6px; padding: 1px 7px; margin-left: 6px; font-weight: 700; vertical-align: middle; }
  .sheetbg { position: fixed; inset: 0; background: rgba(40,30,10,.35); display: none; z-index: 40; align-items: flex-end; justify-content: center; }
  .sheetbg.show { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 760px; max-height: 80vh; overflow: auto; border-radius: 24px 24px 0 0; padding: 18px 16px calc(24px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgba(0,0,0,.15); }
  .sheet h3 { margin: 0 0 4px; font-size: 20px; }
  .sheet .what { color: var(--muted); font-size: 16px; font-weight: 700; margin-bottom: 12px; }
  .dayopt { display: flex; align-items: center; gap: 12px; width: 100%; border: 2px solid var(--line); background: #fff; border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; font-family: inherit; font-size: 18px; font-weight: 800; color: var(--ink); cursor: pointer; text-align: left; }
  .dayopt:active { background: #fff5e6; }
  .dayopt.cur { border-color: var(--accent); background: #fff7ee; }
  .dayopt .n { flex: 1; }
  .dayopt .n small { display: block; font-size: 13px; color: var(--muted); font-weight: 700; }
  .dayopt .load { font-size: 14px; color: var(--muted); font-weight: 800; white-space: nowrap; }
  .dayopt .load.heavy { color: var(--warn); }
  .dayopt.back { border-style: dashed; color: var(--muted); }
  .sheet .cancel { position: sticky; bottom: 0; width: 100%; border: 0; background: #e6e2d8; font-size: 18px; font-weight: 800; padding: 14px; border-radius: 14px; margin-top: 6px; font-family: inherit; cursor: pointer; box-shadow: 0 -6px 14px rgba(255,255,255,.9); }
  .dayopt.del { border-style: dashed; border-color: #f0b4b4; color: var(--warn); }
  .share { display: block; width: 100%; border: 0; background: #fff; color: var(--accent-ink); font-size: 18px; font-weight: 800; padding: 16px; border-radius: 16px; box-shadow: var(--shadow); font-family: inherit; cursor: pointer; margin: 0 0 16px; }

  @media (max-width: 420px) {
    body { font-size: 18px; }
    .today { font-size: 26px; }
    .label { font-size: 20px; }
    .chip { font-size: 13px; min-width: 48px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="today" id="today">載入中…</div>
    <button class="refresh" id="refreshBtn" aria-label="重新整理">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
  </header>

  <div id="notice"></div>
  <div id="countdown"></div>

  <div class="tabs">
    <button class="tab on" data-view="todayView">📋 今天</button>
    <button class="tab" data-view="planView">📅 計畫</button>
  </div>

  <div class="view on" id="todayView">
    <section>
      <h2>✅ 今天要做的 <span class="badge ok" id="todayCount"></span></h2>
      <div class="card" id="todayList"><div class="empty">載入中…</div></div>
    </section>

    <section id="backlogSec" style="display:none">
      <h2>⏰ 之前還沒做完的 <span class="badge" id="backlogCount"></span></h2>
      <div class="card" id="backlogList"></div>
    </section>

    <section id="progressSec" style="display:none">
      <h2>📈 各科進度 <span class="legend" style="margin:0">（點一下看細項）</span></h2>
      <div class="card prog" id="progress"></div>
    </section>
  </div>

  <div class="view" id="planView">
    <button class="share" id="shareBtn">📤 分享給爸媽</button>
    <section>
      <h2>🗓️ 接下來每一天</h2>
      <div class="legend">提前做完可以直接勾。灰色的是每天固定的事；紅色日期是過期還沒做的。</div>
      <button class="pastbtn" id="pastBtn">▸ 看之前 7 天</button>
      <div id="pastDays"></div>
      <div id="planDays"></div>
    </section>
    <section id="eventsSec" style="display:none">
      <h2>📅 近期大事</h2>
      <div class="card events" id="events"></div>
    </section>
  </div>

  <footer>
    <div><span class="status" id="syncStatus">—</span></div>
    <div id="updatedAt"></div>
    <div class="ver" id="ver"></div>
  </footer>
</div>

<div class="sheetbg" id="sheetbg"><div class="sheet" id="sheet"></div></div>

<div class="party" id="party">
  <div class="emoji">🎉</div>
  <h1>全部完成！</h1>
  <p id="partyMsg">今天的功課都做完了，太棒了！</p>
  <button id="partyClose">好耶！</button>
</div>

<script>
/* ===================== 設定（家長只需要改這裡） ===================== */
const CONFIG = {
  // 顯示在頁面角落的版本號，每次改檔案就改一下，方便確認 iPad 拿到新版
  VERSION: '2026.10.25a',

  // 讀取方式：
  //   'repo'：讀這個網站自己的 data/*.csv（預設，零設定；改計畫就改 CSV 推上去）
  //   'gviz'：讀 Google Sheet，Sheet 要設成「知道連結的任何人可檢視」，填 SHEET_ID
  //   'published'：Sheet「發布到網路」，填 PUBLISHED_ID 和各分頁 gid
  READ_MODE: 'repo',
  SHEET_ID: '',            // 例：1AbCdEfG...（gviz 模式用）
  PUBLISHED_ID: '',        // 例：2PACX-1v...（published 模式用）
  GIDS: { '進度母表': '0', '週規則': '', '大事記': '', '完成紀錄': '' },

  // Apps Script Web App 網址（部署後的 /exec 網址）。留空就只存在 iPad 本機。
  SCRIPT_URL: '',

  // 分頁名稱（跟 Sheet 裡的要一樣）
  TABS: { master: '進度母表', weekly: '週規則', events: '大事記', log: '完成紀錄' },

  // 大考前幾天開始出現「✏️ 複習」項目
  EXAM_REVIEW_DAYS: 2,
  // 「之前還沒做完的」最多回看幾天（週規則可用「可補做=否」排除例行項目）
  BACKLOG_DAYS: 3,
  // 近期大事顯示幾天內
  EVENTS_AHEAD_DAYS: 14,
  // 考前幾天算「緩衝日」（改期到這幾天會提醒）
  BUFFER_DAYS: 3,
  // 家長稱呼（分享按鈕用）
  PARENT_NAME: '爸媽',
  // 小孩的名字（慶祝畫面用）
  KID_NAME: '展諒',
};
/* ================================================================== */

const $ = (s) => document.querySelector(s);
const params = new URLSearchParams(location.search);
const DEMO = params.get('demo') === '1';
const SUBJECT_COLORS = ['國語', '數學', '社會', '自然', '英文', '小提琴'];
const subjOrder = (s) => { const i = SUBJECT_COLORS.indexOf(s); return i < 0 ? SUBJECT_COLORS.length : i; };
const byLabel = (a, b) => a.localeCompare(b, 'zh-Hant', { numeric: true });
const WEEK_CN = ['日', '一', '二', '三', '四', '五', '六'];

/* ---------- 小工具 ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function ymd(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }
function todayDate() {
  const o = params.get('date');            // 測試用：?date=2026-10-25
  if (o && /^\d{4}-\d{2}-\d{2}$/.test(o)) return new Date(o + 'T00:00:00');
  const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function daysBetween(a, b) { return Math.round((b - a) / 86400000); }
function parseDate(s, ref) {
  if (!s) return null;
  s = String(s).trim();
  let m;
  const mk = (y, mo, da) => { if (mo < 1 || mo > 12 || da < 1 || da > 31) return null; const d = new Date(y, mo - 1, da); return d.getMonth() === mo - 1 ? d : null; };
  if ((m = s.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/))) return mk(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-/.月](\d{1,2})/))) return mk(ref.getFullYear(), +m[1], +m[2]);
  return null;
}
function fmtDate(d, ref) {
  const diff = daysBetween(ref, d);
  const base = `${d.getMonth() + 1}/${d.getDate()}（${WEEK_CN[d.getDay()]}）`;
  if (diff === 0) return '今天 ' + base;
  if (diff === 1) return '明天 ' + base;
  if (diff === 2) return '後天 ' + base;
  if (diff === -1) return '昨天 ' + base;

}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function subjClass(s) { return SUBJECT_COLORS.includes(s) ? `var(--s-${s})` : 'var(--s-其他)'; }
function store(k, v) { try { if (v === undefined) { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

/* ---------- CSV ---------- */
function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter((r) => r.some((x) => String(x).trim() !== ''));
}
function rowsToObjects(rows) {
  if (!rows.length) return [];
  const head = rows[0].map((h) => String(h).trim());
  return rows.slice(1).map((r) => { const o = {}; head.forEach((h, i) => { o[h] = String(r[i] ?? '').trim(); }); return o; });
}

/* ---------- 讀資料 ---------- */
function tabUrl(tab) {
  const bust = `t=${Date.now()}`;
  if (DEMO || CONFIG.READ_MODE === 'repo') return `data/${encodeURIComponent(tab)}.csv?${bust}`;
  if (CONFIG.READ_MODE === 'published') {
    return `https://docs.google.com/spreadsheets/d/e/${CONFIG.PUBLISHED_ID}/pub?gid=${CONFIG.GIDS[tab] || 0}&single=true&output=csv&${bust}`;
  }
  return `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}&${bust}`;
}
function configured() {
  if (DEMO || CONFIG.READ_MODE === 'repo') return true;
  return CONFIG.READ_MODE === 'published' ? !!CONFIG.PUBLISHED_ID : !!CONFIG.SHEET_ID;
}
async function fetchTab(tab) {
  const r = await fetch(tabUrl(tab), { cache: 'no-store' });
  if (!r.ok) throw new Error(`${tab} HTTP ${r.status}`);
  const txt = await r.text();
  if (/^\s*</.test(txt)) throw new Error(`${tab} 不是 CSV（請確認分享/發布設定）`);
  return rowsToObjects(parseCSV(txt));
}
async function loadAll() {
  const names = CONFIG.TABS;
  const results = await Promise.allSettled([fetchTab(names.master), fetchTab(names.weekly), fetchTab(names.events), fetchTab(names.log)]);
  const [master, weekly, events, log] = results.map((r) => (r.status === 'fulfilled' ? r.value : null));
  const errors = results.filter((r) => r.status === 'rejected').map((r) => r.reason.message);
  // 母表 / 週規則 / 大事記 必須成功；完成紀錄分頁可以沒有
  if (!master || !weekly || !events) throw new Error(errors.join('；'));
  const data = { master, weekly, events, log: log || [], fetchedAt: new Date().toISOString() };
  store('data-cache', data);
  return data;
}

/* ---------- 完成狀態（本機 + 雲端合併） ---------- */
function localState() { return store('done-state') || {}; }
function mergedState(log) {
  const st = { ...localState() };
  for (const r of log) {
    const id = r['項目ID']; if (!id) continue;
    const ts = r['時間戳'] || ''; const done = (r['動作'] || '') === '完成';
    if (!st[id] || (st[id].ts || '') < ts) st[id] = { done, ts, remote: true };
  }
  return st;
}

/* ---------- 送出佇列 ---------- */
let flushing = false;
function enqueue(rec) { const q = store('queue') || []; q.push(rec); store('queue', q); renderSync(); flushQueue(); }
async function flushQueue() {
  if (flushing || !CONFIG.SCRIPT_URL || DEMO) { renderSync(); return; }
  let q = store('queue') || []; if (!q.length) { renderSync(); return; }
  flushing = true;
  try {
    while (q.length) {
      const rec = q[0];
      const r = await fetch(CONFIG.SCRIPT_URL, { method: 'POST', body: JSON.stringify(rec) }); // text/plain，不觸發 preflight
      if (!r.ok) throw new Error('HTTP ' + r.status);
      q.shift(); store('queue', q);
    }
  } catch (e) { console.warn('送出失敗，稍後重試', e); }
  flushing = false; renderSync();
}
function renderSync() {
  const q = store('queue') || []; const el = $('#syncStatus');
  if (DEMO) { el.textContent = '示範模式'; el.className = 'status'; return; }
  if (!CONFIG.SCRIPT_URL) { el.textContent = '勾選記在這台 iPad'; el.className = 'status'; return; }
  if (q.length) { el.textContent = `還有 ${q.length} 筆沒送出`; el.className = 'status warn'; }
  else { el.textContent = '已同步'; el.className = 'status ok'; }
}

/* ---------- 規則展開 ---------- */
function weekdaysOf(s) {
  s = String(s).trim();
  if (/每天|每日|天天|全部/.test(s)) return [0, 1, 2, 3, 4, 5, 6];
  const set = new Set();
  if (/平日|上課日/.test(s)) [1, 2, 3, 4, 5].forEach((d) => set.add(d));
  if (/週末|周末|假日/.test(s)) [0, 6].forEach((d) => set.add(d));
  if (set.size) return [...set];
  s = s.replace(/[週周星期禮拜]/g, '');
  const idx = (ch) => (ch === '天' ? 0 : WEEK_CN.indexOf(ch));
  const rng = s.match(/^([一二三四五六日天])\s*[～~至到\-－]\s*([一二三四五六日天])$/);   // 一～五、一至五
  if (rng) { let a = idx(rng[1]) || 7, b = idx(rng[2]) || 7; if (a > b) [a, b] = [b, a]; for (let i = a; i <= b; i++) set.add(i % 7); return [...set]; }
  for (const ch of s) { const i = idx(ch); if (i >= 0) set.add(i); }
  return [...set];
}
function splitRule(rule) { return String(rule).split(/[＋+；;]/).map((x) => x.trim()).filter(Boolean); }
function masterId(r) { return `m:${r['科目']}|${r['項目']}|${r['子項']}`; }
let MOVES = store('moves') || {};   // iPad 上的改期：{ id: { date, from, ts } }
let EXTRAS = store('extras') || [];  // iPad 上新增的項目：[{ 科目, 項目:'新增', 子項, 目標日, ts }]
// 正式計畫裡已經有同科目同名稱的，就把 iPad 上新增的那筆隱藏
function rowName(r) { return r['科目'] + '|' + [r['項目'], r['子項']].filter(Boolean).join(' '); }
function masterRows(data) {
  const names = new Set(data.master.map(rowName));
  return data.master.concat(EXTRAS.filter((x) => !names.has(x['科目'] + '|' + x['子項'])).map((x) => ({ ...x, 狀態: '已排', 備註: '', _extra: true })));
}
// 正式計畫補進了 iPad 上新增的同名項目：把勾選狀態搬過去，然後把那筆新增拿掉
function migrateExtras(data) {
  const byName = {}; for (const r of data.master) byName[rowName(r)] = r;
  let changed = false;
  EXTRAS = EXTRAS.filter((x) => {
    const off = byName[x['科目'] + '|' + x['子項']]; if (!off) return true;
    const eid = masterId({ ...x }), oid = masterId(off), ls = localState();
    if (ls[eid] && !ls[oid]) { ls[oid] = ls[eid]; STATE[oid] = ls[eid]; }
    delete ls[eid]; delete STATE[eid]; delete MOVES[eid]; store('done-state', ls); changed = true; return false;
  });
  if (changed) { store('extras', EXTRAS); store('moves', MOVES); }
}
function sameDay(a, b, today) { const x = parseDate(a, today), y = parseDate(b, today); return !!x && !!y && ymd(x) === ymd(y); }
function activeMove(r, today) {
  const mv = MOVES[masterId(r)]; if (!mv) return null;
  if (!sameDay(mv.from, r['目標日'], today)) return null;   // 正式計畫已經改過日期，iPad 上的改期作廢
  return parseDate(mv.date, today) ? mv : null;
}
function effDate(r, today) {
  const mv = activeMove(r, today);
  return mv ? parseDate(mv.date, today) : parseDate(r['目標日'], today);
}
function masterItem(r, today) {
  const t = effDate(r, today), mv = activeMove(r, today);
  return { id: masterId(r), subject: r['科目'], label: r._extra ? r['子項'] : [r['項目'], r['子項']].filter(Boolean).join(' '), note: r['備註'] || '', sub: r['備註'] || '', date: t ? ymd(t) : '', orig: r['目標日'] || '', moved: !!(mv && t), extra: !!r._extra, kind: 'master', sheetDone: r['狀態'] === '完成' };
}

function isRoutine(r) { return /^(否|不|no|n)$/i.test(r['可補做'] || ''); }

// 某一天該做的所有項目（週規則 + 母表目標日 + 考前複習）
function itemsForDate(data, d, today) {
  const ds = ymd(d), wd = d.getDay(), out = [];
  for (const r of data.weekly) {
    if (!weekdaysOf(r['星期']).includes(wd)) continue;
    const optional = /^(是|yes|y)$/i.test(r['選做'] || '') || /想做再做|選做/.test(r['規則']);
    for (const part of splitRule(r['規則'])) out.push({ id: `w:${ds}:${r['科目']}:${part}`, subject: r['科目'], label: part, sub: '', date: ds, kind: 'weekly', routine: isRoutine(r), optional });
  }
  for (const r of masterRows(data)) {
    const t = effDate(r, today); if (!t || ymd(t) !== ds) continue;
    out.push(masterItem(r, today));
  }
  for (const e of data.events) {
    if ((e['類型'] || '').indexOf('考') < 0) continue;
    const t = parseDate(e['日期'], today); if (!t) continue;
    const diff = daysBetween(d, t);
    if (diff >= 1 && diff <= CONFIG.EXAM_REVIEW_DAYS) out.push({ id: `e:${ds}:${e['事件']}`, subject: e['科目'] || '複習', label: `✏️ 複習：${e['事件']}`, sub: diff === 1 ? '明天考！' : `${diff} 天後考`, date: ds, kind: 'exam' });
  }
  const order = (a, b) => (subjOrder(a.subject) - subjOrder(b.subject)) || byLabel(a.label, b.label);
  out.sort((a, b) => (a.routine ? 1 : 0) - (b.routine ? 1 : 0) || order(a, b));
  return out;
}

function buildItems(data, today) {
  const todayStr = ymd(today);
  const items = itemsForDate(data, today, today);
  const backlog = [];
  // 前幾天的週規則（例行的除外）
  for (let back = 1; back <= CONFIG.BACKLOG_DAYS; back++) {
    const d = addDays(today, -back);
    for (const it of itemsForDate(data, d, today)) {
      if (it.kind === 'weekly' && !it.routine) backlog.push({ ...it, sub: fmtDate(d, today) });
    }
  }
  // 母表所有過期未完成（不限天數）
  for (const r of masterRows(data)) {
    const d = effDate(r, today); if (!d) continue;
    const ds = ymd(d); if (ds >= todayStr) continue;
    const it = masterItem(r, today); it.sub = fmtDate(d, today) + (it.note ? '・' + it.note : '');
    backlog.push(it);
  }
  backlog.sort((a, b) => a.date.localeCompare(b.date) || subjOrder(a.subject) - subjOrder(b.subject) || byLabel(a.label, b.label));
  return { items, backlog };
}

/* ---------- 畫面 ---------- */
let DATA = null, TODAY = todayDate(), STATE = {};
function isDone(it) { const s = STATE[it.id]; return s ? s.done : !!it.sheetDone; }

function itemHTML(it, opts = {}) {
  const done = isDone(it);
  const movedTag = (it.extra ? '<span class="extra">新增</span>' : '') + (it.moved ? `<span class="moved">改過・原本 ${esc(shortDate(it.orig))}</span>` : '');
  const mvBtn = opts.movable && it.kind === 'master' && !done ? `<button class="mv" data-move="${esc(it.id)}">改天</button>` : '';
  return `<div class="item ${done ? 'done' : ''} ${done && it.id === JUST_ID ? 'just' : ''} ${it.routine ? 'routine' : ''}" data-id="${esc(it.id)}" role="checkbox" aria-checked="${done}">
    <div class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg></div>
    <span class="chip" style="background:${subjClass(it.subject)}">${esc(it.subject)}</span>
    <div class="label">${esc(it.label)}${movedTag}${it.sub ? `<span class="sub">${esc(it.sub)}</span>` : ''}</div>${mvBtn}
  </div>`;
}
function shortDate(s) { const d = parseDate(s, TODAY); return d ? `${d.getMonth() + 1}/${d.getDate()}` : s; }
function eventTag(e) { const t = e['類型'] || ''; return `<span class="t ${t.indexOf('考') >= 0 ? 'exam' : /假/.test(t) ? 'off' : ''}">${esc(t)}</span>`; }

function render() {
  if (!DATA) return;
  const { items, backlog } = buildItems(DATA, TODAY);
  const d = TODAY, todayStr = ymd(d);
  $('#today').innerHTML = `${d.getMonth() + 1}月${d.getDate()}日 星期${WEEK_CN[d.getDay()]}<small>${d.getFullYear()} 年・${CONFIG.KID_NAME}的今日清單</small>`;

  const evs = DATA.events.map((e) => ({ ...e, d: parseDate(e['日期'], d) })).filter((e) => e.d);
  // 倒數
  const exams = evs.filter((e) => (e['類型'] || '').indexOf('考') >= 0 && daysBetween(d, e.d) >= 0).sort((a, b) => a.d - b.d);
  if (exams.length) {
    const ex = exams[0], n = daysBetween(d, ex.d);
    $('#countdown').innerHTML = `<div class="countdown"><div class="num">${n === 0 ? '今天' : `${n}<small>天</small>`}</div><div class="txt">${esc(ex['事件'])}<span>${n === 0 ? '就是今天，加油！' : `還有 ${n} 天・${fmtDate(ex.d, d)}`}</span></div></div>`;
  } else $('#countdown').innerHTML = '';

  // 今日
  const required = items.filter((x) => !x.optional), doneCount = required.filter(isDone).length;
  $('#todayCount').textContent = required.length ? `${doneCount} / ${required.length}` : '';
  const all = required.length > 0 && doneCount === required.length;   // 「想做再做」不算在內
  if (!items.length) $('#todayList').innerHTML = '<div class="empty">今天沒有排功課，好好休息 😊</div>';
  else $('#todayList').innerHTML = (all ? `<div class="alldone"><div class="big">🎉 今天全部完成！</div><p>${esc(CONFIG.KID_NAME)}好棒！</p></div>` : '') + items.map((it) => itemHTML({ ...it, routine: false })).join('');

  // 積欠
  const pending = backlog.filter((it) => !isDone(it));
  $('#backlogSec').style.display = pending.length ? '' : 'none';
  $('#backlogCount').textContent = pending.length;
  $('#backlogList').innerHTML = pending.map((it) => itemHTML(it, { movable: true })).join('');

  // 進度條（可展開細項）
  const subj = {};
  for (const r of masterRows(DATA)) {
    const s = r['科目']; if (!s) continue;
    subj[s] = subj[s] || { total: 0, done: 0, rows: [] };
    const st = STATE[masterId(r)]; const done = st ? st.done : r['狀態'] === '完成';
    const t = effDate(r, d);
    subj[s].total++; if (done) subj[s].done++;
    subj[s].rows.push({ name: (r._extra ? r['子項'] + '（新增）' : [r['項目'], r['子項']].filter(Boolean).join(' ')) + (activeMove(r, d) ? '（改過）' : ''), done, date: t, ds: t ? ymd(t) : '' });
  }
  const keys = Object.keys(subj).sort((a, b) => subjOrder(a) - subjOrder(b));
  $('#progressSec').style.display = keys.length ? '' : 'none';
  $('#progress').innerHTML = keys.map((s) => {
    const p = subj[s], pct = Math.round((p.done / p.total) * 100);
    p.rows.sort((a, b) => (a.done ? 1 : 0) - (b.done ? 1 : 0) || a.ds.localeCompare(b.ds) || byLabel(a.name, b.name));
    const det = p.rows.map((r) => {
      const cls = !r.ds ? '' : r.ds < todayStr && !r.done ? 'late' : r.ds === todayStr ? 'now' : '';
      return `<div class="pd ${r.done ? 'done' : ''}"><span class="mk">${r.done ? '✓' : ''}</span><span class="nm">${esc(r.name)}</span><span class="dt ${cls}">${r.done ? '完成' : r.date ? fmtDate(r.date, d) : '未排'}</span></div>`;
    }).join('');
    return `<div class="prow ${OPEN_SUBJ.has(s) ? 'open' : ''}" data-subj="${esc(s)}"><span class="chip" style="background:${subjClass(s)}">${esc(s)}</span><div class="bar"><i style="width:${pct}%;background:${subjClass(s)}"></i></div><span class="pct">${p.done}/${p.total}</span><span class="arrow">▶</span></div><div class="pdetail">${det}<button class="addbtn" data-add="${esc(s)}">＋ 新增${esc(s)}的項目</button></div>`;
  }).join('');

  // 計畫：按日期（從今天到最後一個排程日，最多 45 天）
  let last = addDays(d, 7);
  for (const r of masterRows(DATA)) { const t = effDate(r, d); if (t && t > last) last = t; }
  for (const e of evs) { if (e.d > last && daysBetween(d, e.d) <= 45) last = e.d; }
  if (daysBetween(d, last) > 45) last = addDays(d, 45);
  const days = [];
  // 過期未完成的先列

  for (const ds of Object.keys(lateByDate).sort()) days.push({ d: new Date(ds + 'T00:00:00'), list: lateByDate[ds], late: true });
  for (let i = 0; i <= daysBetween(d, last); i++) {
    const dd = addDays(d, i), ds = ymd(dd);
    const list = itemsForDate(DATA, dd, d);
    const ev = evs.filter((e) => ymd(e.d) === ds);
    days.push({ d: dd, list, ev, late: false, quiet: i > 0 && list.every((x) => x.routine) });
  }
  // 之前 7 天（收合）
  const past = [];
  for (let i = 7; i >= 1; i--) {
    const dd = addDays(d, -i), list = itemsForDate(DATA, dd, d).filter((x) => !x.routine || isDone(x));
    const ev = evs.filter((e) => ymd(e.d) === ymd(dd));
    if (list.length || ev.length) past.push({ d: dd, list, ev, late: false, past: true });
  }
  $('#pastDays').innerHTML = past.map(dayHTML).join('') || '<div class="card"><div class="empty">之前沒有紀錄</div></div>';
  $('#pastDays').classList.toggle('on', !!store('show-past'));
  $('#pastBtn').textContent = (store('show-past') ? '▾ 收起之前 7 天' : '▸ 看之前 7 天');
  $('#planDays').innerHTML = days.map(dayHTML).join('') || '<div class="card"><div class="empty">還沒有排任何計畫</div></div>';
  function dayHTML(day) {
    const ds = ymd(day.d), isToday = ds === todayStr;
    const real = day.list.filter((x) => !x.routine), dn = real.filter(isDone).length;
    const head = `<div class="dayh"><span class="dn ${isToday ? 'today' : day.late ? 'late' : ''}">${isToday ? '今天 ' : day.late ? '過期 ' : ''}${day.d.getMonth() + 1}/${day.d.getDate()}</span><span class="dw">星期${WEEK_CN[day.d.getDay()]}</span>${(day.ev || []).map((e) => `<span class="ev">${esc(e['事件'])}${eventTag(e)}</span>`).join('')}${real.length ? `<span class="cnt">${dn}/${real.length}</span>` : ''}</div>`;
    if (day.quiet) {
      const routine = day.list.map((x) => esc(x.label)).join('、');
      return `<div class="day quiet">${head}<div class="card"><div class="quietline">沒有排功課${routine ? `・只有 ${routine}` : ''}</div></div></div>`;
    }
    const body = day.list.length ? day.list.map((it) => itemHTML(it, { movable: !day.past })).join('') : '<div class="empty">沒有排功課</div>';
    return `<div class="day">${head}<div class="card">${body}</div></div>`;
  }

  // 近期大事
  const soon = evs.filter((e) => daysBetween(d, e.d) >= 0 && daysBetween(d, e.d) <= CONFIG.EVENTS_AHEAD_DAYS).sort((a, b) => a.d - b.d);
  $('#eventsSec').style.display = soon.length ? '' : 'none';
  $('#events').innerHTML = soon.map((e) => `<div class="ev"><span class="d">${esc(fmtDate(e.d, d))}</span><span>${esc(e['事件'])}</span>${eventTag(e)}</div>`).join('');

  // 慶祝（每天一次）
  if (all && store('celebrated') !== ymd(d) && justToggled) { store('celebrated', ymd(d)); party(); }

  $('#ver').textContent = `版本 ${CONFIG.VERSION}`;
  $('#shareBtn').textContent = `📤 分享給${CONFIG.PARENT_NAME}`;
  if (DATA.fetchedAt) { const t = new Date(DATA.fetchedAt); $('#updatedAt').textContent = `資料更新：${t.getMonth() + 1}/${t.getDate()} ${pad(t.getHours())}:${pad(t.getMinutes())}${DATA.stale ? '（離線，顯示上次的資料）' : ''}`; }
  renderSync();
  const all_ = [...items, ...backlog]; for (const day of [...days, ...past]) for (const it of day.list) if (!all_.find((x) => x.id === it.id)) all_.push(it);
  ALL_ITEMS = all_;
}

let ALL_ITEMS = [], justToggled = false, JUST_ID = null;
const OPEN_SUBJ = new Set(store('open-subj') || []);
function toggle(id) {
  const it = ALL_ITEMS.find((x) => x.id === id); if (!it) return;
  const next = !isDone(it); const ts = new Date().toISOString();
  STATE[it.id] = { done: next, ts };
  const ls = localState(); ls[it.id] = { done: next, ts }; store('done-state', ls);
  if (CONFIG.SCRIPT_URL) enqueue({ ts, date: ymd(TODAY), id: it.id, action: next ? '完成' : '取消', name: `${it.subject}｜${it.label}` });
  if (navigator.vibrate) navigator.vibrate(next ? 30 : 10);
  justToggled = true; JUST_ID = it.id; render(); justToggled = false; JUST_ID = null;
}
document.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab');
  if (tab) { showView(tab.dataset.view); return; }
  const prow = e.target.closest('.prow');
  if (prow) { const s = prow.dataset.subj; const was = OPEN_SUBJ.has(s); OPEN_SUBJ.clear(); if (!was) OPEN_SUBJ.add(s); store('open-subj', [...OPEN_SUBJ]); render(); return; }   // 一次只展開一科
  const mv = e.target.closest('.mv');
  if (mv) { e.stopPropagation(); openMove(mv.dataset.move); return; }
  if (e.target.closest('#pastBtn')) { store('show-past', !store('show-past')); render(); return; }
  const del = e.target.closest('.dayopt.del');
  if (del) { deleteExtra(del.dataset.id); return; }
  const ad = e.target.closest('.addbtn');
  if (ad) { e.stopPropagation(); openAdd(ad.dataset.add); return; }
  if (e.target.closest('.go')) { submitAdd(); return; }
  if (e.target.closest('#shareBtn')) { shareSummary(); return; }
  const opt = e.target.closest('.dayopt');
  if (opt) { applyMove(opt.dataset.id, opt.dataset.date); return; }
  if (e.target.closest('.cancel') || e.target.id === 'sheetbg') { $('#sheetbg').classList.remove('show'); return; }
  const row = e.target.closest('.item');
  if (row && !row.classList.contains('routine')) toggle(row.dataset.id);   // 計畫頁也能勾（提前做完）；灰色例行項目在計畫頁不勾
});

/* ---------- 改期 ---------- */
function examsSorted() { return DATA.events.map((e) => ({ ...e, d: parseDate(e['日期'], TODAY) })).filter((e) => e.d && (e['類型'] || '').indexOf('考') >= 0).sort((a, b) => a.d - b.d); }
let PENDING_ADD = null;
function openAdd(subject) {
  $('#sheet').innerHTML = `<h3>新增${esc(subject)}的項目</h3><div class="what">例如：評量 第 7 回、習作 p.20</div><input id="addName" placeholder="要做什麼？" maxlength="40"><button class="go">下一步：選哪一天</button><button class="cancel" style="margin-top:8px">不新增</button>`;
  PENDING_ADD = { subject }; $('#sheetbg').classList.add('show'); $('#addName').focus();
}
function submitAdd() {
  const name = ($('#addName').value || '').trim(); if (!name) { $('#addName').focus(); return; }
  PENDING_ADD.name = name;
  openMove('new:' + PENDING_ADD.subject, { subject: PENDING_ADD.subject, label: name, orig: ymd(TODAY), date: '', moved: false });
}
function openMove(id, draft) {
  const it = draft || ALL_ITEMS.find((x) => x.id === id); if (!it) return;
  const orig = parseDate(it.orig, TODAY) || TODAY;
  const exam = examsSorted().find((e) => e.d > orig);
  let deadline = exam ? addDays(exam.d, -1) : addDays(orig, 14);
  if (deadline < TODAY) deadline = addDays(TODAY, 7);
  const evs = DATA.events.map((e) => ({ ...e, d: parseDate(e['日期'], TODAY) })).filter((e) => e.d);
  const cur = it.date;
  let html = `<h3>${draft ? '哪一天做？' : '改到哪一天？'}</h3><div class="what">${esc(it.subject)}｜${esc(it.label)}${exam ? `・最晚 ${shortDate(ymd(deadline))}（${esc(exam['事件'])}前一天）` : ''}</div>`;
  for (let i = 0; i <= daysBetween(TODAY, deadline); i++) {
    const dd = addDays(TODAY, i), ds = ymd(dd);
    const others = itemsForDate(DATA, dd, TODAY).filter((x) => !x.routine && x.id !== id);
    const load = others.length, same = others.filter((x) => x.subject === it.subject).length;
    const tags = evs.filter((e) => ymd(e.d) === ds).map((e) => esc(e['事件'])).join('、');
    const buffer = exam && daysBetween(dd, exam.d) <= CONFIG.BUFFER_DAYS;
    html += `<button class="dayopt ${ds === cur ? 'cur' : ''}" data-id="${esc(id)}" data-date="${ds}"><span class="n">${esc(fmtDate(dd, TODAY))}<small>${tags}${tags && buffer ? '・' : ''}${buffer ? '緩衝日，盡量別排' : ''}</small></span><span class="load ${load >= 6 ? 'heavy' : ''}">${ds === cur ? '現在在這天' : load ? `已有 ${load} 項${same ? `，${esc(it.subject)} ${same} 項` : ''}` : '那天沒事'}</span></button>`;
  }
  if (it.moved) html += `<button class="dayopt back" data-id="${esc(id)}" data-date=""><span class="n">回到原本的 ${esc(shortDate(it.orig))}</span></button>`;
  if (it.extra) html += `<button class="dayopt del" data-id="${esc(id)}"><span class="n">🗑 刪掉這個新增的項目</span></button>`;
  html += `<button class="cancel">不改了</button>`;
  $('#sheet').innerHTML = html; $('#sheetbg').classList.add('show');
}
function deleteExtra(id) {
  EXTRAS = EXTRAS.filter((x) => masterId({ ...x }) !== id); store('extras', EXTRAS);
  const ls = localState(); delete ls[id]; store('done-state', ls); delete STATE[id]; delete MOVES[id]; store('moves', MOVES);
  $('#sheetbg').classList.remove('show'); render();
}
function applyMove(id, date) {
  if (id.startsWith('new:')) {
    if (date && PENDING_ADD) {
      const dup = EXTRAS.find((x) => x['科目'] === PENDING_ADD.subject && x['子項'] === PENDING_ADD.name);
      if (dup) dup['目標日'] = date; else EXTRAS.push({ 科目: PENDING_ADD.subject, 項目: '新增', 子項: PENDING_ADD.name, 目標日: date, ts: new Date().toISOString() });
      store('extras', EXTRAS);
    }
    PENDING_ADD = null; $('#sheetbg').classList.remove('show'); render(); return;
  }
  const it = ALL_ITEMS.find((x) => x.id === id);
  if (!date) delete MOVES[id];
  else if (it && sameDay(date, it.orig, TODAY)) delete MOVES[id];   // 改回原本的日期就等於沒改
  else if (date !== (it && it.date)) MOVES[id] = { date, from: it ? it.orig : '', ts: new Date().toISOString() };
  store('moves', MOVES); $('#sheetbg').classList.remove('show'); render();
}

/* ---------- 分享摘要 ---------- */
async function shareSummary() {
  const { items, backlog } = buildItems(DATA, TODAY);
  const d = TODAY, lines = [`${CONFIG.KID_NAME}課業 ${d.getMonth() + 1}/${d.getDate()}（${WEEK_CN[d.getDay()]}）`];
  const doneToday = items.filter((x) => !x.routine && isDone(x)), notToday = items.filter((x) => !x.routine && !isDone(x));
  lines.push(`✅ 今天做完：${doneToday.length ? doneToday.map((x) => `${x.subject} ${x.label}`).join('、') : '（還沒有）'}`);
  if (notToday.length) lines.push(`⬜ 今天還沒做：${notToday.map((x) => `${x.subject} ${x.label}`).join('、')}`);
  const late = backlog.filter((x) => !isDone(x));
  if (late.length) lines.push(`⏰ 之前沒做完：${late.map((x) => `${x.subject} ${x.label}（${shortDate(x.date)}）`).join('、')}`);
  const mv = Object.entries(MOVES);
  if (mv.length) lines.push('🔁 改期：' + mv.map(([id, m]) => { const it = ALL_ITEMS.find((x) => x.id === id); return `${it ? it.subject + ' ' + it.label : id}：${shortDate(m.from)}→${shortDate(m.date)}`; }).join('、'));
  const subj = {};
  const ex = masterRows(DATA).filter((r) => r._extra);
  if (ex.length) lines.push('➕ iPad 新增：' + ex.map((r) => `${r['科目']} ${r['子項']}（${shortDate(r['目標日'])}）`).join('、'));
  for (const r of masterRows(DATA)) { const s = r['科目']; subj[s] = subj[s] || [0, 0]; subj[s][1]++; const st = STATE[masterId(r)]; if (st ? st.done : r['狀態'] === '完成') subj[s][0]++; }
  lines.push('📈 進度：' + Object.entries(subj).map(([s, [a, b]]) => `${s} ${a}/${b}`).join('、'));
  const text = lines.join('\n');
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); alert('已複製，貼到訊息裡傳給' + CONFIG.PARENT_NAME + '就好'); } catch (e) { prompt('複製這段文字：', text); }
}
function showView(id) {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.view === id));
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('on', v.id === id));
  store('view', id);
}
showView(store('view') || 'todayView');

function party() {
  const p = $('#party'); p.classList.add('show');
  $('#partyMsg').textContent = `${CONFIG.KID_NAME}今天的功課都做完了，太棒了！`;
  const colors = ['#ff7b7b', '#4f9dff', '#f6b73c', '#45c58a', '#9b7bff', '#e07bbf'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.animationDuration = 2 + Math.random() * 2 + 's'; c.style.animationDelay = Math.random() * 1.5 + 's';
    p.appendChild(c); setTimeout(() => c.remove(), 5000);
  }
}
$('#partyClose').onclick = () => $('#party').classList.remove('show');

/* ---------- 載入流程 ---------- */
let loading = false;
async function refresh() {
  if (loading) return; loading = true;
  const btn = $('#refreshBtn'); btn.classList.add('spin');
  try { await refreshInner(); } finally { loading = false; btn.classList.remove('spin'); }
}
async function refreshInner() {
  const btn = $('#refreshBtn');
  const srcName = CONFIG.READ_MODE === 'repo' ? '網路' : 'Google Sheet';
  TODAY = todayDate();
  if (!configured()) {
    $('#notice').innerHTML = `<div class="notice">還沒設定 Google Sheet。請打開 <code>index.html</code>，在 CONFIG 填入 <code>SHEET_ID</code>（或 <code>PUBLISHED_ID</code>）。<br>想先看看長什麼樣子，可以在網址後面加 <code>?demo=1</code>。</div>`;
    const cache = store('data-cache'); if (cache) { DATA = { ...cache, stale: true }; STATE = mergedState(DATA.log); render(); }
    else $('#todayList').innerHTML = '<div class="empty">尚未設定資料來源</div>';
    btn.classList.remove('spin'); return;
  }
  try {
    DATA = await loadAll(); $('#notice').innerHTML = '';
  } catch (e) {
    const cache = store('data-cache');
    if (cache) { DATA = { ...cache, stale: true }; $('#notice').innerHTML = `<div class="notice">現在沒有${srcName}，先顯示上次的資料。</div>`; console.warn(e); }
    else { $('#notice').innerHTML = `<div class="notice">現在沒有${srcName}，讀不到資料。<br><small>${esc(e.message)}</small></div>`; $('#todayList').innerHTML = '<div class="empty">等有網路再按右上角重新整理</div>'; return; }
  }
  STATE = mergedState(DATA.log);
  migrateExtras(DATA);
  render();
  flushQueue();
}
$('#refreshBtn').onclick = refresh;
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') refresh(); });
window.addEventListener('online', flushQueue);
window.addEventListener('pageshow', (e) => { if (e.persisted) refresh(); });
// 跨日自動換頁（放著不關的情況）
setInterval(() => { if (ymd(todayDate()) !== ymd(TODAY)) refresh(); }, 60000);
refresh();
</script>
</body>
