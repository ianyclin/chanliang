<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb26b"/>
      <stop offset="1" stop-color="#ff7a59"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff6e8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#8a3a10" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- 清單卡片 -->
  <rect x="96" y="76" width="320" height="360" rx="40" fill="url(#card)" filter="url(#sh)"/>
  <!-- 夾子 -->
  <rect x="196" y="52" width="120" height="56" rx="20" fill="#ffd36b"/>
  <rect x="226" y="40" width="60" height="30" rx="12" fill="#f3b73f"/>
  <!-- 三行項目 -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <rect x="136" y="150" width="46" height="46" rx="12" fill="#45c58a"/>
    <polyline points="148,174 158,185 172,163" fill="none" stroke="#fff" stroke-width="8"/>
    <rect x="200" y="162" width="160" height="22" rx="11" fill="#ffd9c2"/>

    <rect x="136" y="232" width="46" height="46" rx="12" fill="#45c58a"/>
    <polyline points="148,256 158,267 172,245" fill="none" stroke="#fff" stroke-width="8"/>
    <rect x="200" y="244" width="120" height="22" rx="11" fill="#ffd9c2"/>

    <rect x="136" y="314" width="46" height="46" rx="12" fill="none" stroke="#cfc6b4" stroke-width="7"/>
    <rect x="200" y="326" width="140" height="22" rx="11" fill="#eee4d2"/>
  </g>
  <!-- 星星 -->
  <path d="M400 330 l14 30 32 4 -24 22 7 32 -29 -17 -29 17 7 -32 -24 -22 32 -4z" fill="#ffd36b" stroke="#f3b73f" stroke-width="6" stroke-linejoin="round"/>
</svg>
